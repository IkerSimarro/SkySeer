name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Cache star catalogue and solver databases
        uses: actions/cache@v4
        with:
          path: data/astro
          key: astro-${{ runner.os }}-${{ hashFiles('src/skyseer/astro/catalog.py', 'src/skyseer/astro/_vendor/tetra3.py') }}
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov=skyseer --cov-report=term-missing

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Synthetic benchmark
        run: uv run skyseer bench --scenes 10 >> "$GITHUB_STEP_SUMMARY"
