name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Cache star catalogue and solver databases
        uses: actions/cache@v6
        with:
          path: data/astro
          key: astro-${{ runner.os }}-${{ hashFiles('src/skyseer/astro/catalog.py', 'src/skyseer/astro/_vendor/tetra3.py') }}
      - name: Lint
        run: |
          uv run ruff check src tests tools
          uv run ruff format --check src tests tools
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov=skyseer --cov-report=term-missing --junitxml=pytest.xml
      # Logs need a GitHub sign-in to read; annotations don't.
      - name: Show failed tests
        if: failure() && hashFiles('pytest.xml') != ''
        run: uv run python tools/ci_failures.py pytest.xml

  pi:
    # The Pi's own software: 64-bit ARM, Raspberry Pi OS packages (including the real
    # camera library) and SkySeer installed the way deploy/pi/install.sh does it.
    name: pi (Raspberry Pi OS ${{ matrix.release }})
    runs-on: ubuntu-24.04-arm
    container: debian:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: [trixie, bookworm]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Raspberry Pi package archive
        # The archive's key, from the same package Raspberry Pi OS installs it from: its
        # 2025 copy is signed with SHA-512 (trixie's apt rejects the old SHA-1 signatures).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          deb=raspberrypi-archive-keyring_2025.1+rpt1_all.deb
          curl -fsSLO https://archive.raspberrypi.com/debian/pool/main/r/raspberrypi-archive-keyring/$deb
          echo "2e727149d7acb8cc7f604e66d0049161039c8aa1eaf1175e54f9e69d963d60e4  $deb" | sha256sum -c
          dpkg -i $deb
          archive="http://archive.raspberrypi.com/debian/ ${{ matrix.release }} main"
          keyring=/usr/share/keyrings/raspberrypi-archive-keyring.pgp
          echo "deb [signed-by=$keyring] $archive" > /etc/apt/sources.list.d/raspberrypi.list
          apt-get update
      - name: System packages (as install.sh)
        run: apt-get install -y python3-picamera2 python3-venv python3-dev git
      - uses: actions/checkout@v7
      - name: Python environment (install.sh's own step)
        run: ./deploy/pi/setup-python.sh --group dev
      - name: Camera library loads next to SkySeer's packages
        run: |
          .venv/bin/python - <<'PY'
          import platform, subprocess, traceback
          try:
              import av, cv2, numpy, picamera2
          except Exception:
              text = traceback.format_exc().replace('%', '%25').replace(chr(10), '%0A')
              print('::error title=Camera library::' + text)
              raise SystemExit(1)
          apt = subprocess.run(['dpkg-query', '-W', '-f=${Version}', 'python3-picamera2'],
                               capture_output=True, text=True).stdout
          print('::notice title=Pi environment::Python', platform.python_version(),
                platform.machine(), '| numpy', numpy.__version__, 'from', numpy.__file__,
                '| opencv', cv2.__version__, '| av', av.__version__, '| picamera2', apt)
          PY
      - name: Cache star catalogue and solver databases
        uses: actions/cache@v6
        with:
          path: data/astro
          key: astro-pi-${{ hashFiles('src/skyseer/astro/catalog.py', 'src/skyseer/astro/_vendor/tetra3.py') }}
      - name: Tests
        run: .venv/bin/python -m pytest -q -rs --junitxml=pytest.xml
      - name: Show failed tests
        if: failure() && hashFiles('pytest.xml') != ''
        run: .venv/bin/python tools/ci_failures.py pytest.xml
      - name: The service's command starts the station (no camera here)
        run: |
          .venv/bin/skyseer station --config configs/pi.yaml --port 8000 \
            --lat 40.42 --lon -3.70 > station.log 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8000/api/health > health.json 2>/dev/null && break
            sleep 2
          done
          kill $pid || true
          .venv/bin/python - <<'PY'
          import json, pathlib
          log = pathlib.Path('station.log').read_text(errors='replace')[-1500:]
          try:
              live = json.loads(pathlib.Path('health.json').read_text())['live']
              assert live['mode'] in ('waiting', 'observing') and live['location'], live
          except Exception as exc:
              text = f'{exc!r} / log: {log}'.replace('%', '%25').replace(chr(10), '%0A')
              print('::error title=Station did not start::' + text)
              raise SystemExit(1)
          print('::notice title=Station::mode', live['mode'], '| sun', live['sun_altitude'],
                '| error', live['station_error'])
          PY

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Synthetic benchmark
        run: uv run skyseer bench --scenes 10 >> "$GITHUB_STEP_SUMMARY"
