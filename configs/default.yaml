# SkySeer default configuration.
# Every value here is also the built-in default; copy this file and change only what you
# need, then run e.g.  skyseer analyze video.mp4 --config my.yaml
# Units: pixels are full-resolution image pixels, "frame" means a source video frame.

pipeline:
  frame_skip: 1               # process every Nth frame (2-3 speeds up long videos)
  disturbance_fraction: 0.005 # >0.5% of the picture changing at once = camera moved or
                              # scene changed (normal sky, even cloudy, stays < 0.3%)
  disturbance_padding_s: 1.0  # tracks this close to a disturbance are discarded

stabilise:                    # camera-shake correction, measured from the stars like a star tracker
  enabled: true
  max_stars: 60               # reference stars whose centres are measured every frame
  min_stars: 8                # fewer measurable stars (clouds, twilight): no correction
  min_star_snr: 6.0           # star peak above the sky, in units of the pixel noise
  search_px: 15               # coarse search radius: most a star may move between frames
  window_px: 5                # window for each star's sub-pixel centre
  agree_px: 2.5               # stars agreeing on the shift within this are still tracked
  keyframe_s: 10.0            # pick fresh reference stars this often (the sky drifts)
  trend_s: 3.0                # slower motion is drift, left to the background model
  step_px: 3.0                # a sudden jump this big (beyond the shaking) is a knock: kept corrected
  confirm_s: 0.3              # stars suddenly lost this long = camera moved (glitches recover)
  min_shift_px: 0.25          # smaller jitter is harmless and not corrected
  max_shift_px: 15.0          # bigger jumps are real camera moves (handled as disturbances)

detector:
  sensitivity: 5              # 1-10; higher finds fainter, smaller blobs (and more noise)
  process_scale: 1.0          # downscale before detection: 0.5 = ~3x faster on HD video,
                              # but faint satellites can be missed on a bright sky
  gpu: true                   # background model on the graphics card (OpenCL) if there is one
  mog2_history: 500           # frames of background memory
  mog2_var_threshold: 35.0    # lower = more sensitive to dim changes
  blur_kernel: 3              # 1 = none; more blur dims tiny satellites
  morph_kernel: 1             # mask clean-up; >1 erases objects smaller than the kernel
  group_px: 1                 # blob pieces up to 2x this apart are one object (0 = off)
  min_area_px: null           # override the minimum blob size that sensitivity implies
  max_area_fraction: 0.01     # ignore blobs bigger than 1% of the frame (clouds, headlights)

tracker:
  max_distance: 60.0          # px between predicted position and a detection
  new_track_distance: 150.0   # px gate for a track's second point (velocity still unknown)
  max_missed_seconds: 3.0     # a track ends after this long unseen (bridges faint gaps)
  process_noise: 1.0          # Kalman: how much objects may accelerate
  measurement_noise: 2.0      # Kalman: centroid jitter in px
  merge_area_ratio: 1.4       # overlapping objects: a blob this much bigger is skipped

filter:
  min_duration: 0.3           # seconds
  max_duration: null          # seconds, null = no limit
  min_detections: 3

star_filter:                  # tracks drifting in lockstep are background stars
  enabled: true
  min_group_size: 4
  velocity_tolerance: 0.1     # relative speed difference
  direction_tolerance_deg: 10.0
  min_temporal_overlap: 0.5
  max_spatial_distance: 500.0
  min_speed: 0.01

classifier:
  method: rules               # rules = hand-written baseline; model = learned (skyseer train)
  model_path: data/models/classifier.joblib

rules:                        # heuristic baseline classifier
  # Speeds are in image diagonals per second, so the rules work at any resolution.
  meteor_reference_speed: 0.4       # "fast": crossing ~40% of the frame per second
  meteor_max_duration: 3.0          # s
  satellite_duration_bands: [[1.0, 0.3], [2.0, 0.6], [3.0, 0.85]]   # [upper_s, factor]
  satellite_long_factor: 1.0        # long passes are normal with wide lenses
  plane_duration_bands: [[1.5, 0.5]]
  plane_long_factor: 1.0
  plane_base_score: 0.1             # planes are recognised by their strobe rhythm
  cloud_texture: 3.0                # surroundings this much noisier than clear sky = cloud
  blink_change_threshold: 0.15
  direction_change_deg: 30.0
  junk_base_score: 0.1
  stationary_speed: 0.0015          # slower tracks are noise or stars
  # One object, not noise linked up by the tracker:
  smooth_px: 2.0                    # median px off where neighbours put each point (2x: noise)
  plane_smooth_px: 3.0              # the same for aircraft (strobes)
  jump_share: 0.5                   # share of the path covered in one sudden jump: two specks
  evidence_rate: 0.3                # satellites/aircraft are seen in this share of frames...
  evidence_count: 40.0              # ...or at least this many times

observer:                     # where the camera is (GPS fills this in on the station)
  latitude: null              # degrees, north positive
  longitude: null             # degrees, east positive
  elevation_m: 0.0

astro:                        # star-based calibration (plate solving)
  fov_estimate: null          # approx. horizontal field of view in degrees, e.g. 55 for
                              # the Pi HQ camera + 6 mm lens; speeds up the first solve
  fov_tolerance: 10.0
  calibration_seconds: 2.0    # seconds of video stacked into one clean star image
  database_min_fov: 20.0      # range of fields of view the star database supports
  database_max_fov: 70.0
  database_max_mag: 6.5       # faintest catalogue stars used
  data_dir: data/astro        # star catalogue and databases are cached here

satellites:                   # naming satellites from public orbit data (needs the location)
  enabled: true
  groups: [active, visual]    # CelesTrak lists: active payloads + bright rocket bodies
  max_age_hours: 24.0         # re-download orbits older than this (cached for offline use)
  extra_tle_files: []         # e.g. historical orbits for an old video (space-track.org)
  max_clock_offset_s: 3.0     # how wrong the camera clock may be; ~0.1 with GPS time
  max_cross_track_deg: 0.3    # max sideways distance between seen and predicted path
  max_timing_spread_s: 0.5    # max variation of the timing offset along the path
  candidate_radius_deg: 2.0
  max_candidates: 40
  max_elements_age_days: 10.0 # orbits further than this from the recording date are unusable

aircraft:                     # naming aircraft from their ADS-B broadcasts (needs the location)
  enabled: true
  source: none                # live: none, opensky (free online) or readsb (local receiver)
  readsb_url: http://localhost/tar1090/data/aircraft.json
  radius_km: 150.0            # ignore aircraft further away
  poll_s: 10.0                # OpenSky gives new positions every 10 s (5 s with an account)
  active_only: true           # ask only while something crosses the view (saves credits)
  max_requests_per_day: 380   # OpenSky allows 400 a day without an account, 4000 with one
  check_delay_s: 15.0         # live: identify once broadcasts after the pass have arrived
  max_cross_track_deg: 0.5    # max sideways distance between seen and broadcast path
  min_arc_deg: 0.5            # shorter paths aren't matched (their direction can't be checked)
  max_clock_offset_s: 3.0     # how wrong the camera clock may be
  max_timing_spread_s: 1.0    # max variation of the timing offset along the path
  candidate_radius_deg: 8.0
  max_gap_s: 30.0             # interpolate between broadcasts at most this far apart
  max_extrapolate_s: 15.0     # dead-reckon from speed and heading at most this far

showers:                      # meteor shower association (IAU Meteor Data Center list)
  enabled: true
  # Tuned by Monte Carlo: ~96% of shower meteors found, ~5% of sporadics matched by chance
  max_radiant_offset_deg: 2.5 # backward path must pass this close to the radiant (+ error)
  direction_error_deg: 0.05   # position error at each end of a meteor path
  max_offset_cap_deg: 6.0
  min_arc_deg: 1.0            # shorter paths can't be traced back reliably
  min_radiant_distance_deg: 2.0
  max_radiant_distance_deg: 90.0
  min_radiant_elevation_deg: -5.0
  min_speed_ratio: 0.6        # observed / expected angular speed (needs the location)
  max_speed_ratio: 1.5
  min_members: 0              # e.g. 1000 to only use well-observed (major) showers

moon:                         # where the Moon is (needs the location and a star calibration)
  enabled: true
  near_deg: 5.0               # events passing this close to its centre are marked near it

photometry:
  fireball_magnitude: -4.0    # this bright or brighter = fireball (Venus is about -4)
  aperture_px: 4.0            # star photometry radius (captures ~99% of a sharp star)

alerts:                       # fireball alerts; nothing is sent unless configured
  log_file: data/alerts.jsonl
  webhook_url: null           # POST a JSON message here
  ntfy_topic: null            # push to your phone with the free ntfy app

clips:                        # a short video clip + trail image + context image per event
  enabled: true
  pre_roll_s: 1.0             # clip starts this long before the object appears
  post_roll_s: 1.0            # ...and ends this long after (up to disturbance_padding_s)
  max_frames: 300             # longer events become time-lapses (x2, x4, ...)
  recent_seconds: 8.0         # frames this recent are all kept in memory...
  buffer_seconds: 120.0       # ...older ones are thinned out; none older than this
  buffer_mb: 1024.0           # memory budget: frames are stored smaller beyond it
  color: false                # colour clips need 3x the memory
  width: 640                  # pixel width of clips and images
  margin_px: 40.0             # space around the path in the zoomed clip
  min_crop_px: 200.0          # smallest region a clip zooms into
  crf: 22                     # H.264 quality, lower = better (26 erased faint objects)
  clean_copy: [Meteor]        # also save a clip without markings (live nights can't later)

storage:                      # the station's record of every night
  database: data/skyseer.db   # SQLite file: sessions, events and human reviews
  runs_dir: data/runs         # analysed recordings, one folder each
  live_dir: data/live         # live camera nights, one folder each

station:                      # the unattended station (`skyseer station`)
  camera: "0"                 # camera index, stream URL, or picamera on a Raspberry Pi
  dark_sun_altitude: -12.0    # observe while the Sun is below this (nautical twilight)
  always_on: false            # observe around the clock (testing)
  keep_clips_days: 30.0       # clips of live nights older than this are deleted
  min_free_gb: 5.0            # below this much free disk the oldest clips go first
  check_interval_s: 60.0      # how often to check the Sun
  retry_s: 60.0               # wait before retrying a camera that failed

gps:                          # where the station is, and the true time
  source: none                # none, gpsd (Linux GPS service) or a device like /dev/ttyACM0
  gpsd_host: 127.0.0.1
  gpsd_port: 2947
  cache_file: data/station_location.json  # last good position, used until a new fix
  min_satellites: 4           # satellites needed to trust a fix
  max_clock_error_s: 2.0      # warn if the system clock is this far from GPS time

camera:                       # the live camera (exposure/gain/colour: Raspberry Pi camera)
  width: null                 # null = the camera's default size
  height: null
  fps: 10.0                   # frames per second; each frame's exposure fills it
  exposure_ms: null           # null = 95% of the frame time
  gain: 8.0                   # higher = brighter but noisier
  colour_gains: [2.0, 1.8]    # fixed white balance (red, blue)
